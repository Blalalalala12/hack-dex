<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hack-Dex</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#0e1019;--surface:#171a28;--line:#272c42;--text:#e9ebf5;--muted:#8d93ad;--accent:#ff5d4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 14px 12px;border-bottom:3px solid var(--accent)}
h1{margin:0 0 10px;font-size:1.35rem;letter-spacing:-.01em}
.controls{display:grid;gap:8px}
select,input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{margin:10px 14px 0;color:var(--muted);font-size:.85rem}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;padding:12px 14px 28px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.name{font-size:1.2rem;font-weight:700}
.num{color:var(--muted);font-variant-numeric:tabular-nums}
.types{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:3px 11px;border-radius:99px;font-size:.8rem;font-weight:600;color:#10121a}
h3{margin:0 0 4px;font-size:.85rem;color:var(--muted);font-weight:600}
ul{margin:0;padding-left:18px}
li{margin:2px 0}
.note{background:#0e1019;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#10121a;font-size:2rem;font-weight:700;line-height:1;z-index:6}
.ov{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;margin:12px 0 4px;color:var(--muted);font-size:.85rem}
textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:6px 12px;border-radius:99px;font:inherit;font-size:.85rem}
.chip.on{color:#10121a;border-color:transparent;font-weight:600}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.btn.pri{background:var(--accent);color:#10121a;border:0;font-weight:700}
.acts{display:flex;gap:8px}
.mini{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;font-size:.85rem}
@media(min-width:640px){.controls{grid-template-columns:240px 1fr}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hack-Dex">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1019">
</head>
<body>
<header>
  <h1>Hack-Dex</h1>
  <div class="controls">
    <select id="hack" aria-label="ROM-Hack wählen"></select>
    <input id="q" type="search" placeholder="Name, Typ, Fundort oder Nummer …" aria-label="Suche" autocomplete="off">
  </div>
</header>
<div class="count" id="count" aria-live="polite"></div>
<main id="list"></main>
<button class="fab" id="fab" aria-label="Pokémon eintragen">+</button>
<div class="ov" id="ov"><div class="sheet">
  <h2 style="margin:0;font-size:1.1rem">Pokémon eintragen</h2>
  <label for="fh">Hack (ein neuer Name legt einen neuen Hack an)</label><input id="fh" list="hl"><datalist id="hl"></datalist>
  <label for="fid">Nummer (gleiche Nummer überschreibt den Eintrag)</label><input id="fid" type="number" inputmode="numeric" min="1">
  <label for="fn">Name</label><input id="fn">
  <label>Typen (höchstens 2)</label><div class="chips" id="chips"></div>
  <label for="fl">Fundorte (eine Zeile pro Ort)</label><textarea id="fl" rows="3"></textarea>
  <label for="fe">Entwicklung (eine Zeile pro Methode)</label><textarea id="fe" rows="3"></textarea>
  <label for="fno">Strategie-Notiz</label><textarea id="fno" rows="3"></textarea>
  <div class="row"><button class="btn" id="cancel">Abbrechen</button><button class="btn pri" id="save">Speichern</button></div>
  <div class="row"><button class="btn" id="exp">Sicherung kopieren</button><button class="btn" id="imp">Sicherung einfügen</button></div>
  <div class="row"><button class="btn" id="gh">GitHub-Sync einrichten</button></div>
</div></div>

[[1,1,151,"#6aa8ff"],[2,152,251,"#f2c14e"],[3,252,386,"#4fd1a5"],[4,387,493,"#b48cff"],[5,494,649,"#ff7a9c"]].forEach(([g,a,b,c]) =>

const $ = id => document.getElementById(id);
const sel = $("hack"), q = $("q"), list = $("list");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = "hackdex-custom";
let onStore = () => {};
let custom = {};
try { custom = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(custom)); } catch(e) { alert("Speichern auf diesem Gerät nicht möglich."); } onStore(); };
const base = {};
for (const h in HACKS) base[h] = HACKS[h].pokemon.slice();
function apply(){
  for (const h in custom) if (!HACKS[h]) HACKS[h] = { pokemon:[] };
  for (const h in HACKS) {
    const over = custom[h] || [];
    if (!(h in base) && !over.length) { delete HACKS[h]; continue; }
    HACKS[h].pokemon = [...(base[h] || []).filter(p => !over.some(o => o.id === p.id)), ...over.map(o => ({...o, custom:true}))].sort((a,b) => a.id - b.id);
  }
}
function fillSel(keep){
  const v = keep || sel.value; sel.innerHTML = "";
  Object.keys(HACKS).sort((a,b) => a.localeCompare(b,"de")).forEach(n => sel.add(new Option(n, n)));
  sel.value = HACKS[v] ? v : "Basis-Dex Gen 1";
}
apply(); fillSel("Basis-Dex Gen 1");

const ov = $("ov"), F = { h:$("fh"), id:$("fid"), n:$("fn"), l:$("fl"), e:$("fe"), no:$("fno") };
let chosen = [];
$("chips").innerHTML = Object.keys(TYPE_COLORS).map(t => `<button type="button" class="chip" data-t="${t}">${t}</button>`).join("");
const paint = () => document.querySelectorAll(".chip").forEach(c => { const on = chosen.includes(c.dataset.t); c.classList.toggle("on", on); c.style.background = on ? TYPE_COLORS[c.dataset.t] : ""; });
$("chips").onclick = e => { const t = e.target.dataset.t; if (!t) return; chosen = chosen.includes(t) ? chosen.filter(x => x !== t) : chosen.length < 2 ? [...chosen, t] : chosen; paint(); };
function openForm(p){
  $("hl").innerHTML = Object.keys(HACKS).map(h => `<option value="${esc(h)}">`).join("");
  F.h.value = sel.value; F.id.value = p ? p.id : ""; F.n.value = p ? p.name : ""; chosen = p ? [...p.types] : [];
  F.l.value = p ? p.locations.join("\n") : ""; F.e.value = p ? p.evolutions.join("\n") : ""; F.no.value = p ? p.note : "";

}
$("fab").onclick = () => openForm(null);

$("save").onclick = () => {
  const h = F.h.value.trim(), id = parseInt(F.id.value, 10), n = F.n.value.trim();
  if (!h || !n || !(id > 0)) { alert("Bitte Hack, Nummer und Name ausfüllen."); return; }
  const lines = v => v.split("\n").map(s => s.trim()).filter(Boolean);
  const p = { id, name:n, types:chosen.slice(), locations:lines(F.l.value), evolutions:lines(F.e.value), note:F.no.value.trim() };

/* GitHub-Sync: speichert die eigenen Einträge als custom.json im Repository (optional, braucht Token) */
const GK = "hackdex-gh";
let gh = {}; try { gh = JSON.parse(localStorage.getItem(GK) || "{}"); } catch(e) {}
let dirty = false; try { dirty = localStorage.getItem(GK + "-dirty") === "1"; } catch(e) {}
const setDirty = v => { dirty = v; try { localStorage.setItem(GK + "-dirty", v ? "1" : "0"); } catch(e) {} };
const ghUrl = () => `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/custom.json`;
const ghHead = () => ({ Authorization:"Bearer " + gh.token, Accept:"application/vnd.github+json" });
async function pull(){
  const r = await fetch(ghUrl(), { headers:ghHead(), cache:"no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  return { sha:j.sha, data: JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, ""))))) };
}
async function push(){
  const cur = await pull();
  const body = { message:"Hack-Dex: Daten aktualisiert", content: btoa(unescape(encodeURIComponent(JSON.stringify(custom, null, 1)))) };
  if (cur) body.sha = cur.sha;
  const r = await fetch(ghUrl(), { method:"PUT", headers:{ ...ghHead(), "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status);
  setDirty(false);
}
function takeRemote(data){
  custom = data; try { localStorage.setItem(KEY, JSON.stringify(custom)); } catch(e) {}
  setDirty(false); apply(); fillSel(); render();
}
onStore = async () => {
  if (!gh.token) return;
  setDirty(true);
  try { await push(); $("count").textContent += " · bei GitHub gespeichert"; }
  catch(e) { alert("GitHub-Speichern fehlgeschlagen (" + e.message + "). Die Änderung bleibt auf dem Gerät und wird beim nächsten Start erneut versucht."); }
};
$("gh").onclick = async () => {
  const g = location.hostname.endsWith("github.io") ? { owner:location.hostname.split(".")[0], repo:location.pathname.split("/")[1] || "" } : {};
  const owner = prompt("GitHub-Benutzername:", gh.owner || g.owner || ""); if (!owner) return;
  const repo = prompt("Repository-Name:", gh.repo || g.repo || "hack-dex"); if (!repo) return;
  const token = prompt("Token (nur dieses Repository, Contents: Read and write):", gh.token || ""); if (!token) return;
  gh = { owner:owner.trim(), repo:repo.trim(), token:token.trim() };
  try { localStorage.setItem(GK, JSON.stringify(gh)); } catch(e) {}
  try {
    const cur = await pull();
    if (cur && Object.keys(cur.data).length && (!Object.keys(custom).length || confirm("Im Repository liegen schon Einträge.\nOK = diese übernehmen (lokale werden ersetzt)\nAbbrechen = lokale hochladen (ersetzen die im Repository)"))) {
      takeRemote(cur.data); ov.classList.remove("on"); alert("Verbunden. Einträge aus GitHub geladen."); return;
    }
    await push(); alert("Verbunden. Deine Einträge liegen jetzt in custom.json im Repository.");
  } catch(e) { alert("Verbindung fehlgeschlagen (" + e.message + "). Prüfe Name, Repository und Token."); }
};
(async () => {
  if (!gh.token) return;
  try { if (dirty) await push(); else { const cur = await pull(); if (cur) takeRemote(cur.data); } } catch(e) {}
})();

  list.innerHTML = hits.length ? hits.map(p => `

      <div class="acts"><button class="mini" data-e="${p.id}">Bearbeiten</button>${p.custom ? `<button class="mini" data-d="${p.id}">Zurücksetzen</button>` : ""}</div>
    </article>`).join("")
    : "<div class='empty'>" + (hack.pokemon.length ? "Kein Treffer. Prüfe die Schreibweise oder suche nach Typ oder Fundort." : "Für diesen Hack sind noch keine Pokémon eingetragen. Ergänze sie im Datenblock im Code.") + "</div>";
}
sel.addEventListener("change", render);
q.addEventListener("input", render);
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
